name: Connected Cloud Gateway CI/CD

on:
  push:
    branches: [main]
    paths:
      - "connected-cloud-server/**"
      - ".github/workflows/gateway.yml"
  pull_request:
    paths:
      - "connected-cloud-server/**"
      - ".github/workflows/gateway.yml"

jobs:
  test:
    name: Test Gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: connected-cloud-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --omit=dev || true
      - name: Run gateway integration tests
        run: npm test

  deploy:
    name: Build & Push image (GHCR)
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image name
        id: img
        run: echo "name=ghcr.io/${{ github.repository_owner }}/connected-gateway" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./connected-cloud-server
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
      - name: Done
        run: echo "Imagem publicada em ${{ steps.img.outputs.name }}:latest — aponta o host (Cloud Run/Render/Fly) para esta imagem com CCS_API_KEY e CCS_SIGN_KEY como secrets."
